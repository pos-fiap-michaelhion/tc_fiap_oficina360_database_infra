name: Terraform Database Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        required: true
        type: choice
        options:
          - validate
          - deploy
          - destroy

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: true
  TF_INPUT: false

defaults:
  run:
    working-directory: infra

jobs:
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        if: inputs.action == 'deploy' || inputs.action == 'destroy'
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'oficina360/database/lab.tfstate' }}
        run: |
          set -euo pipefail

          : "${TF_STATE_BUCKET:?Repository Variable TF_STATE_BUCKET nao definida}"
          : "${TF_STATE_KEY:?Repository Variable TF_STATE_KEY nao definida}"

          echo "Backend bucket: $TF_STATE_BUCKET"
          echo "Backend key: $TF_STATE_KEY"

          aws s3api head-bucket \
            --bucket "$TF_STATE_BUCKET"

          terraform init -reconfigure \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        if: inputs.action == 'validate'
        run: terraform validate

      - name: Configurar variaveis legadas do Terraform
        env:
          VPC_ID: ${{ vars.VPC_ID }}
          SUBNET_A_ID_CONFIGURED: ${{ vars.SUBNET_A_ID }}
          SUBNET_IDS_CONFIGURED: ${{ vars.SUBNET_IDS || vars.LAMBDA_SUBNET_IDS }}
          DEFAULT_SECURITY_GROUP_ID_CONFIGURED: ${{ vars.DEFAULT_SECURITY_GROUP_ID }}
        run: |
          set -euo pipefail

          : "${VPC_ID:?Organization Variable VPC_ID nao definida}"

          SUBNET_A_ID="$SUBNET_A_ID_CONFIGURED"

          if [[ -z "$SUBNET_A_ID" ]]; then
            : "${SUBNET_IDS_CONFIGURED:?SUBNET_A_ID e SUBNET_IDS/LAMBDA_SUBNET_IDS nao definidas}"
            IFS=',' read -r -a SUBNET_ARRAY <<< "$SUBNET_IDS_CONFIGURED"
            SUBNET_A_ID="${SUBNET_ARRAY[0]:-}"
          fi

          if [[ ! "$SUBNET_A_ID" =~ ^subnet-[0-9a-f]+$ ]]; then
            echo "::error::subnet_a_id invalida: $SUBNET_A_ID"
            exit 1
          fi

          DEFAULT_SECURITY_GROUP_ID="$DEFAULT_SECURITY_GROUP_ID_CONFIGURED"

          if [[ -z "$DEFAULT_SECURITY_GROUP_ID" ]]; then
            DEFAULT_SECURITY_GROUP_ID="$(
              aws ec2 describe-security-groups \
                --filters \
                  "Name=vpc-id,Values=$VPC_ID" \
                  "Name=group-name,Values=default" \
                --query 'SecurityGroups[0].GroupId' \
                --output text
            )"
          fi

          if [[ ! "$DEFAULT_SECURITY_GROUP_ID" =~ ^sg-[0-9a-f]+$ ]]; then
            echo "::error::default_security_group_id invalido: $DEFAULT_SECURITY_GROUP_ID"
            exit 1
          fi

          SUBNET_VPC_ID="$(
            aws ec2 describe-subnets \
              --subnet-ids "$SUBNET_A_ID" \
              --query 'Subnets[0].VpcId' \
              --output text
          )"

          SG_VPC_ID="$(
            aws ec2 describe-security-groups \
              --group-ids "$DEFAULT_SECURITY_GROUP_ID" \
              --query 'SecurityGroups[0].VpcId' \
              --output text
          )"

          if [[ "$SUBNET_VPC_ID" != "$VPC_ID" ]]; then
            echo "::error::SUBNET_A_ID pertence a $SUBNET_VPC_ID, mas VPC_ID=$VPC_ID"
            exit 1
          fi

          if [[ "$SG_VPC_ID" != "$VPC_ID" ]]; then
            echo "::error::DEFAULT_SECURITY_GROUP_ID pertence a $SG_VPC_ID, mas VPC_ID=$VPC_ID"
            exit 1
          fi

          echo "TF_VAR_subnet_a_id=$SUBNET_A_ID" >> "$GITHUB_ENV"
          echo "TF_VAR_default_security_group_id=$DEFAULT_SECURITY_GROUP_ID" >> "$GITHUB_ENV"

          echo "subnet_a_id configurada: $SUBNET_A_ID"
          echo "default_security_group_id configurado: $DEFAULT_SECURITY_GROUP_ID"

      - name: Terraform Plan
        if: inputs.action == 'validate'
        run: terraform plan

      - name: Configurar rede do Terraform
        env:
          VPC_ID: ${{ vars.VPC_ID }}
          SUBNET_IDS: ${{ vars.LAMBDA_SUBNET_IDS }}
          DATABASE_ACCESS_SECURITY_GROUP_ID: ${{ vars.LAMBDA_SECURITY_GROUP_ID }}
        run: |
          set -euo pipefail

          : "${VPC_ID:?Organization Variable VPC_ID nao definida}"
          : "${SUBNET_IDS:?Organization Variable LAMBDA_SUBNET_IDS nao definida}"
          : "${DATABASE_ACCESS_SECURITY_GROUP_ID:?Organization Variable LAMBDA_SECURITY_GROUP_ID nao definida}"

          if [[ ! "$VPC_ID" =~ ^vpc-[0-9a-f]+$ ]]; then
            echo "::error::VPC_ID possui formato invalido."
            exit 1
          fi

          if [[ ! "$SUBNET_IDS" =~ ^subnet-[0-9a-f]+(,subnet-[0-9a-f]+)+$ ]]; then
            echo "::error::LAMBDA_SUBNET_IDS deve conter pelo menos duas subnets."
            exit 1
          fi

          if [[ ! "$DATABASE_ACCESS_SECURITY_GROUP_ID" =~ ^sg-[0-9a-f]+$ ]]; then
            echo "::error::LAMBDA_SECURITY_GROUP_ID possui formato invalido."
            exit 1
          fi

          SUBNET_IDS_JSON="$(
            jq -Rc \
              'split(",") | map(select(length > 0))' \
              <<< "$SUBNET_IDS"
          )"

          echo "TF_VAR_vpc_id=$VPC_ID" >> "$GITHUB_ENV"
          echo "TF_VAR_subnet_ids=$SUBNET_IDS_JSON" >> "$GITHUB_ENV"

          echo "TF_VAR_database_access_security_group_id=$DATABASE_ACCESS_SECURITY_GROUP_ID" \
            >> "$GITHUB_ENV"

          echo "Rede do RDS configurada."
          echo "VPC: $VPC_ID"
          echo "Subnets: $SUBNET_IDS"
          echo "Security Group: $DATABASE_ACCESS_SECURITY_GROUP_ID"

      - name: Terraform Apply
        if: inputs.action == 'deploy'
        run: terraform apply -auto-approve

      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -auto-approve