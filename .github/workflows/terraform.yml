name: Terraform Database Infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        required: true
        type: choice
        options:
          - validate
          - deploy
          - destroy

permissions:
  contents: read

concurrency:
  group: oficina360-database-terraform
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_STATE_KEY: oficina360/database/lab.tfstate

jobs:
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 40

    defaults:
      run:
        shell: bash
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS credentials
        if: inputs.action == 'deploy' || inputs.action == 'destroy'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve AWS identity and Terraform backend securely
        if: inputs.action == 'deploy' || inputs.action == 'destroy'
        working-directory: .
        run: |
          set -euo pipefail

          IDENTITY_JSON="$(aws sts get-caller-identity --output json)"
          ACCOUNT_ID="$(jq -r '.Account' <<< "$IDENTITY_JSON")"
          CALLER_ARN="$(jq -r '.Arn' <<< "$IDENTITY_JSON")"
          USER_ID="$(jq -r '.UserId' <<< "$IDENTITY_JSON")"

          : "${ACCOUNT_ID:?AWS Account ID nao identificado}"
          : "${CALLER_ARN:?AWS Caller ARN nao identificado}"
          : "${USER_ID:?AWS User ID nao identificado}"

          echo "::add-mask::$ACCOUNT_ID"
          echo "::add-mask::$CALLER_ARN"
          echo "::add-mask::$USER_ID"
          echo "::add-mask::${CALLER_ARN##*/}"

          TF_STATE_BUCKET="oficina360-tfstate-${ACCOUNT_ID}-${AWS_REGION}"

          echo "::add-mask::$TF_STATE_BUCKET"
          echo "::add-mask::$TF_STATE_KEY"
          echo "TF_STATE_BUCKET=$TF_STATE_BUCKET" >> "$GITHUB_ENV"

          echo "Identidade AWS validada."
          echo "Backend Terraform resolvido para a sessao atual."

      - name: Resolve current database network
        if: inputs.action == 'deploy' || inputs.action == 'destroy'
        working-directory: .
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          PROJECT_NAME: oficina360
          ENVIRONMENT: lab
        run: |
          set -euo pipefail

          test -f scripts/resolve-database-network.sh || {
            echo "::error::Script scripts/resolve-database-network.sh nao encontrado."
            exit 1
          }

          bash scripts/resolve-database-network.sh

      - name: Validate backend access
        if: inputs.action == 'deploy' || inputs.action == 'destroy'
        working-directory: .
        run: |
          set -euo pipefail

          : "${TF_STATE_BUCKET:?TF_STATE_BUCKET nao resolvido}"
          : "${TF_STATE_KEY:?TF_STATE_KEY nao definido}"

          echo "::add-mask::$TF_STATE_BUCKET"
          echo "::add-mask::$TF_STATE_KEY"

          aws s3api head-bucket --bucket "$TF_STATE_BUCKET"
          echo "Backend S3 acessivel."

      - name: Terraform Init
        if: inputs.action == 'deploy' || inputs.action == 'destroy'
        run: |
          set -euo pipefail

          terraform init \
            -reconfigure \
            -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"

      - name: Terraform Init without backend
        if: inputs.action == 'validate'
        run: |
          set -euo pipefail
          terraform init -backend=false -input=false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        if: inputs.action == 'deploy'
        run: |
          set -euo pipefail

          if ! terraform plan \
            -input=false \
            -no-color \
            -out=tfplan \
            > /tmp/terraform-plan.txt 2>&1; then

            echo "::error::Falha ao gerar o plano Terraform."
            grep -E '^(Error:|Warning:)|^[[:space:]]*Error:' \
              /tmp/terraform-plan.txt || true
            exit 1
          fi

          terraform show -json tfplan > /tmp/terraform-plan.json

          CREATE_COUNT="$(jq '[.resource_changes[]? | select(.change.actions | index("create"))] | length' /tmp/terraform-plan.json)"
          UPDATE_COUNT="$(jq '[.resource_changes[]? | select(.change.actions == ["update"])] | length' /tmp/terraform-plan.json)"
          DELETE_COUNT="$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' /tmp/terraform-plan.json)"

          echo "Plano Terraform gerado."
          echo "Criacoes ou substituicoes: $CREATE_COUNT"
          echo "Atualizacoes: $UPDATE_COUNT"
          echo "Remocoes ou substituicoes: $DELETE_COUNT"

      - name: Terraform Apply
        if: inputs.action == 'deploy'
        run: |
          set -euo pipefail
          terraform apply -auto-approve tfplan

      - name: Deployment summary
        if: inputs.action == 'deploy'
        run: |
          set -euo pipefail

          RDS_IDENTIFIER="$(terraform output -raw rds_identifier)"
          echo "::add-mask::$RDS_IDENTIFIER"

          RDS_STATUS="$(
            aws rds describe-db-instances \
              --db-instance-identifier "$RDS_IDENTIFIER" \
              --region "$AWS_REGION" \
              --query 'DBInstances[0].DBInstanceStatus' \
              --output text
          )"

          echo "Infraestrutura do banco aplicada."
          echo "Status do RDS: $RDS_STATUS"
          echo "Outputs detalhados foram omitidos dos logs."

      - name: Terraform Destroy Plan
        if: inputs.action == 'destroy'
        run: |
          set -euo pipefail

          if ! terraform plan \
            -destroy \
            -input=false \
            -no-color \
            -out=tfdestroy \
            > /tmp/terraform-destroy-plan.txt 2>&1; then

            echo "::error::Falha ao gerar o plano de destroy."
            grep -E '^(Error:|Warning:)|^[[:space:]]*Error:' \
              /tmp/terraform-destroy-plan.txt || true
            exit 1
          fi

          terraform show -json tfdestroy > /tmp/terraform-destroy-plan.json

          DELETE_COUNT="$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' /tmp/terraform-destroy-plan.json)"

          if (( DELETE_COUNT == 0 )); then
            echo "::warning::Nenhum recurso sera removido."
          fi

          echo "Plano de destroy gerado."
          echo "Recursos com remocao planejada: $DELETE_COUNT"

      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        run: |
          set -euo pipefail
          terraform apply -auto-approve tfdestroy
